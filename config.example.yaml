# DingTalk plugin config example

channels:
  dingtalk:
    enabled: true
    clientId: "your_app_key_here"
    clientSecret: "your_app_secret_here"
    robotCode: "your_robot_code_here"
    dm:
      policy: pairing
      allowFrom:
        - "user_staff_id_1"
        - "user_staff_id_2"
    groupPolicy: open
    groups:
      "group_conversation_id_1":
        enabled: true
        requireMention: false
        toolPolicy: "default"

